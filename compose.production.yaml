x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }
x-app: &app
  image: ${PULSO_IMAGE:-pulso:production}
  build: { context: ., target: runtime }
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:size=64m,mode=1777"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging: *logging
  networks: [application]
  stop_grace_period: 20s

services:
  postgres:
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PULSO_DB_USER:-pulso}
      POSTGRES_DB: ${PULSO_DB_NAME:-pulso}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8 --data-checksums"
    secrets: [postgres_password]
    volumes: ["postgres_data:/var/lib/postgresql"]
    shm_size: 256m
    command: ["postgres", "-c", "max_connections=40", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=1024MB", "-c", "work_mem=4MB", "-c", "maintenance_work_mem=64MB", "-c", "max_wal_size=512MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    cpus: 1.0
    mem_limit: 2048m
    logging: *logging
    networks: [application]
    stop_grace_period: 60s

  migrate:
    image: ${PULSO_TOOLS_IMAGE:-pulso:tools}
    build: { context: ., target: tools }
    restart: "no"
    environment: { DATABASE_URL_FILE: /run/secrets/database_url, NODE_OPTIONS: "--max-old-space-size=512" }
    secrets: [database_url]
    depends_on: { postgres: { condition: service_healthy } }
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cpus: 0.5
    mem_limit: 768m
    logging: *logging
    networks: [application]

  web:
    <<: *app
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      NEXTAUTH_SECRET_FILE: /run/secrets/nextauth_secret
      INSTAGRAM_ACCESS_TOKEN_FILE: /run/secrets/instagram_token
      INSTAGRAM_API_VERSION: ${INSTAGRAM_API_VERSION:-v25.0}
      NEXTAUTH_URL: ${PULSO_PUBLIC_URL:?Configure PULSO_PUBLIC_URL}
      NODE_OPTIONS: "--max-old-space-size=1024"
    secrets: [database_url, nextauth_secret, instagram_token]
    depends_on: { postgres: { condition: service_healthy }, migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "node", "ops/runtime/healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4
    cpus: 1.0
    mem_limit: 1536m

  worker:
    <<: *app
    command: ["node", "ops/runtime/worker.mjs"]
    environment: { DATABASE_URL_FILE: /run/secrets/database_url, NODE_OPTIONS: "--max-old-space-size=64" }
    secrets: [database_url]
    depends_on: { postgres: { condition: service_healthy }, migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "node", "ops/runtime/worker-healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    cpus: 0.2
    mem_limit: 128m

  caddy:
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    environment: { PULSO_DOMAIN: "${PULSO_DOMAIN:?Configure PULSO_DOMAIN}" }
    ports:
      - "${PULSO_BIND_IP:-0.0.0.0}:${PULSO_HTTP_PORT:-80}:80"
      - "${PULSO_BIND_IP:-0.0.0.0}:${PULSO_HTTPS_PORT:-443}:443"
    volumes: ["./ops/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: { web: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    cpus: 0.25
    mem_limit: 128m
    logging: *logging
    networks: [application]

  tools:
    profiles: [tools]
    image: ${PULSO_TOOLS_IMAGE:-pulso:tools}
    build: { context: ., target: tools }
    environment: { DATABASE_URL_FILE: /run/secrets/database_url }
    secrets: [database_url]
    networks: [application]
    mem_limit: 768m
    logging: *logging

  backup:
    profiles: [backup]
    init: true
    stop_grace_period: 60s
    image: ${PULSO_BACKUP_IMAGE:-pulso:backup}
    build: { context: ., dockerfile: ops/backup/Dockerfile }
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${PULSO_DB_USER:-pulso}
      PGDATABASE: ${PULSO_DB_NAME:-pulso}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      BACKUP_INTERVAL_SECONDS: "86400"
    secrets: [postgres_password, restic_password, s3_access_key, s3_secret_key]
    depends_on: { postgres: { condition: service_healthy } }
    tmpfs: ["/tmp:size=256m,mode=1777"]
    volumes: ["backup_cache:/root/.cache/restic"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/backup-ok && test $$(($$(date +%s)-$$(cat /tmp/backup-ok))) -lt 90000"]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3
    cpus: 0.25
    mem_limit: 512m
    logging: *logging
    networks: [application]

networks:
  application:
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  backup_cache:
secrets:
  postgres_password: { file: ./deploy/secrets/postgres_password }
  database_url: { file: ./deploy/secrets/database_url }
  nextauth_secret: { file: ./deploy/secrets/nextauth_secret }
  instagram_token: { file: ./deploy/secrets/instagram_token }
  restic_password: { file: ./deploy/secrets/restic_password }
  s3_access_key: { file: ./deploy/secrets/s3_access_key }
  s3_secret_key: { file: ./deploy/secrets/s3_secret_key }
